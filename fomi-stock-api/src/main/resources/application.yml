spring:
  application:
    name: fomi-stock-api
  profiles:
    active: dev

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

fomi:
  jwt:
    secret: ${JWT_SECRET:ChangeMeInProductionUseAtLeast256BitsSecretKeyForFOMI2026!}
    expiration-ms: 86400000
